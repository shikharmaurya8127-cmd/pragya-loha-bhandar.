function list(id){const c=id==='all'?null:cat(id);if(id!=='all'&&!c)return nf();
 if(last!==id){F={};sortBy='new';last=id}

 const fs=[['b','Brand'],...A.filter(a=>a[0]!=='usage').map(a=>a)].filter(([k])=>opts(k).length>1);

 ps.sort((a,b)=>sortBy==='az'?a.n.localeCompare(b.n):sortBy==='lo'?(a.price||1e12)-(b.price||1e12):sortBy==='hi'?(b.price||0)-(a.price||0):b.t-a.t);

function search(){setT('Search');return `<h1>Search</h1><label for="q">Name, brand, category or size</label><input id="q" type="search" oninput="sq(this.value)" autofocus><div id="res" style="margin-top:14px"></div>`}
function sq(v){v=v.trim().toLowerCase();$('#res').innerHTML=!v?'':(r=>r.length?grid(r):'<p class="note">No products found. Try a different word.</p>')(live().filter(p=>[p.n,p.b,cat(p.c)?.n,...Object.values(p.a)].join(' ').toLowerCase().includes(v)))}

 +(r=>r.length?`<h2>Related products</h2>${grid(r)}`:'')(live().filter(x=>x.c===p.c&&x.id!==p.id).slice(0,4))}

function about(){setT('About us');return S.h.about?`<h1>About ${esc(S.s.name)}</h1><p>${esc(S.h.about)}</p>`:nf()}

function adm(x,id){
 if(x==='edit'){const d=draft,i=d.im;return `<h1>${d.id==='new'?'Add product':'Edit product'}</h1>
 <label for="n">Product name</label><input id="n" value="${esc(d.n)}" oninput="draft.n=this.value">

 <label>Photos</label><div class="imgs">${i.map((u,k)=>`<div><img src="${u}" alt=""><button class="o" onclick="mv(${k},-1)" aria-label="Move earlier">${k?'←':'★ Main'}</button><button class="o" onclick="rm(${k})">Remove</button></div>`).join('')}</div>
 <input type="file" accept="image/*" multiple onchange="addImg(this.files)" style="margin-top:10px">
 <label for="d">Description</label><textarea id="d" oninput="draft.d=this.value">${esc(d.d)}</textarea>
 <label for="pr">Price (optional)</label><input id="pr" type="number" inputmode="decimal" value="${esc(d.price)}" oninput="draft.price=this.value"><label class="c"><input type="checkbox" ${d.sh?'checked':''} onchange="draft.sh=this.checked">Show price on website</label>
 <label for="av">Availability</label><select id="av" onchange="draft.av=this.value">${Object.entries(AV).map(([k,v])=>`<option value="${k}" ${d.av===k?'selected':''}>${v}</option>`).join('')}</select>
 <label class="c"><input type="checkbox" ${d.f?'checked':''} onchange="draft.f=this.checked">Featured on home page</label><label class="c"><input type="checkbox" ${d.nw?'checked':''} onchange="draft.nw=this.checked">New arrival</label>
 <details><summary>Advanced details</summary><label for="b">Brand</label><input id="b" value="${esc(d.b)}" oninput="draft.b=this.value">${A.map(([k,l])=>`<label for="a${k}">${l}</label><input id="a${k}" value="${esc(d.a[k])}" oninput="draft.a['${k}']=this.value">`).join('')}
 <label>Other specifications</label>${d.sp.map((s,k)=>`<div class="fl"><input aria-label="Name" placeholder="e.g. Thickness" value="${esc(s[0])}" oninput="draft.sp[${k}][0]=this.value"><input aria-label="Value" placeholder="e.g. 8 mm" value="${esc(s[1])}" oninput="draft.sp[${k}][1]=this.value"></div>`).join('')}<button class="b o" onclick="draft.sp.push(['','']);r(1)" style="margin-bottom:12px">+ Add specification</button></details>
 <div class="sticky"><button class="b" onclick="save()">Save product</button>${d.id!=='new'?`<button class="b o" onclick="dup()">Duplicate</button><button class="b d" onclick="del()">Delete</button>`:''}</div>`}
 if(x==='cats')return `<h1>Categories</h1><button class="b" onclick="addCat(null)" style="margin:12px 0">+ Add main category</button>`+S.categories.map(c=>`<div class="row" style="padding-left:${10+depth(c)*20}px"><span style="flex:1">${esc(c.n)}</span><button class="lk" onclick="ren('${c.id}')">Rename</button><button class="lk" onclick="addCat('${c.id}')">+ Sub</button><button class="lk" style="color:#b3261e" onclick="delCat('${c.id}')">Delete</button></div>`).join('');
 if(x==='settings'){const f=(k,l,h='')=>`<label for="s${k}">${l}</label><input id="s${k}" value="${esc(S.s[k])}" placeholder="${h}" oninput="S.s['${k}']=this.value;dirty=1;pb()">`;
  return `<h1>Shop settings</h1>${f('name','Business name')}${f('phone','Phone (with country code)','91XXXXXXXXXX')}${f('wa','WhatsApp number (with country code)','91XXXXXXXXXX')}${f('email','Email')}<label for="sa">Address</label><textarea id="sa" oninput="S.s.addr=this.value;dirty=1;pb()">${esc(S.s.addr)}</textarea>${f('maps','Google Maps link')}${f('hours','Business hours','Mon-Sat 10am-8pm')}${f('ig','Instagram link')}${f('fb','Facebook link')}<h2>Home page</h2><label for="ht">Headline</label><input id="ht" value="${esc(S.h.title)}" oninput="S.h.title=this.value;dirty=1;pb()"><label for="hs">Sub-headline</label><input id="hs" value="${esc(S.h.sub)}" oninput="S.h.sub=this.value;dirty=1;pb()"><label for="ha">About the shop</label><textarea id="ha" oninput="S.h.about=this.value;dirty=1;pb()">${esc(S.h.about)}</textarea><label for="hb">Trusted brands (one per line)</label><textarea id="hb" oninput="S.h.brands=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);dirty=1;pb()">${esc((S.h.brands||[]).join('\n'))}</textarea><label for="hw">Why choose us: text</label><textarea id="hw" oninput="S.h.whyText=this.value;dirty=1;pb()">${esc(S.h.whyText)}</textarea><label for="hp">Why choose us: points (one per line, 4 look best)</label><textarea id="hp" oninput="S.h.points=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);dirty=1;pb()">${esc((S.h.points||[]).join('\n'))}</textarea>`}
 return `<h1>Products</h1><a class="btn" href="#/a/edit/new" style="margin:12px 0">+ Add product</a>`+([...live()].sort((a,b)=>b.t-a.t).map(p=>`<a class="row" href="#/a/edit/${p.id}">${ph(p)}<span><b>${esc(p.n)}</b><br><small>${esc(cat(p.c)?.n||'No category')}${p.demo?' · Demo':''}</small></span></a>`).join('')||'<p class="note">No products yet.</p>')}
const pb=()=>{const e=$('#pub');e&&e.classList.toggle('on',!!dirty)};
const mark=()=>{dirty=1};
async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,900/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72)}
async function addImg(fs){for(const f of fs)try{draft.im.push(await shrink(f))}catch(e){alert('Could not read that photo.')}r(1)}
const mv=(k,d)=>{if(k>0){[draft.im[k-1],draft.im[k]]=[draft.im[k],draft.im[k-1]]}r(1)},rm=k=>{draft.im.splice(k,1);r(1)};
function save(){const d=draft;if(!d.n.trim()||!d.c)return alert('Please add a product name and choose a category.');d.n=d.n.trim();d.sp=d.sp.filter(s=>s[0]&&s[1]);
 if(d.id==='new'){Object.assign(d,{id:rid(d.n),t:Date.now(),demo:0});S.products.push(d)}else S.products=S.products.map(p=>p.id===d.id?d:p);mark();location.hash='#/a/products'}
function dup(){const d=JSON.parse(JSON.stringify(draft));Object.assign(d,{id:rid(d.n),n:d.n+' (copy)',t:Date.now(),demo:0});S.products.push(d);mark();location.hash='#/a/edit/'+d.id}
function del(){if(confirm('Delete this product?')){S.products=S.products.filter(p=>p.id!==draft.id);mark();location.hash='#/a/products'}}
function addCat(p){const n=prompt('Category name');if(n&&n.trim()){S.categories.push({id:rid(n),p,n:n.trim()});mark();r(1)}}
function ren(id){const c=cat(id),n=prompt('New name',c.n);if(n&&n.trim()){c.n=n.trim();mark();r(1)}}
function delCat(id){const c=cat(id);if(confirm(`Delete "${c.n}"? Its products and sub-categories move up one level.`)){S.categories.forEach(k=>{if(k.p===id)k.p=c.p});S.products.forEach(p=>{if(p.c===id)p.c=c.p||''});S.categories=S.categories.filter(k=>k.id!==id);mark();r(1)}}

/* ---------- shell, routing, publish ---------- */
function shell(v,ad){
 const nav=ad?[['products','Products'],['cats','Categories'],['settings','Settings']].map(([k,l])=>`<a class="btn o" href="#/a/${k}">${l}</a>`).join('')+`<a class="btn o" href="#/">View site</a>`:[btnWA(0,'WhatsApp'),tel()&&`<a class="btn o" href="${tel()}">Call</a>`,dir()&&`<a class="btn o" href="${dir()}" target="_blank" rel="noopener">Directions</a>`].filter(Boolean).join('');
 const lg=`<span class="lg">${esc(S.s.name.split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase())}</span>`,nm=esc(S.s.name);
 const ft=`<footer><a class="brand" href="#/">${lg}<span class="bn"><b>${nm}</b><small>Tiles and sanitarywares</small></span></a><nav><a href="#/">Home</a><a href="#/c/all">Products</a>${S.h.about?'<a href="#/about">About Us</a>':''}<a href="#/contact">Contact</a></nav><p>© ${new Date().getFullYear()} ${nm}</p><p>Quality · Trust · Durability</p></footer>`;
 return `<header><a class="brand" href="#/">${lg}<span class="bn"><b>${nm}</b><small>Tiles and sanitarywares</small></span></a><div><a class="lk" href="#/s/">Search</a><button class="lk" aria-label="Menu" onclick="document.body.classList.toggle('m')">☰</button></div></header><main class="${ad?'ad':''}">${(location.hash===''||location.hash==='#/')?'':'<button class="bkb" onclick="back()">← Back</button>'}${ad?`<div class="pub ${dirty?'on':''}" id="pub"><span>Changes not published yet</span><button onclick="publish()">Publish</button></div>`:''}${v}</main>${ad?'':ft}${nav?`<div class="bar">${nav}</div>`:''}`}
function menu(){$('#menu').innerHTML=`<button class="lk" onclick="document.body.classList.remove('m')">Close</button><a href="#/">Home</a><a href="#/c/all">All products</a>`+S.categories.filter(c=>!c.p).map(t=>`<a href="#/c/${t.id}">${esc(t.n)}</a>`+kids(t.id).map(k=>`<a class="s" href="#/c/${k.id}">${esc(k.n)}</a>`).join('')).join('')+`<a href="#/contact">Contact</a>`+(canEdit?`<a href="#/a/products"><b>Manage shop</b></a>`:'')}
function r(keep){document.body.classList.remove('m');const h=location.hash.slice(2).split('/'),k=h[0]||'',x=decodeURIComponent(h[1]||''),y=decodeURIComponent(h[2]||'');
 const ad=k==='a'&&canEdit;
 if(ad&&x==='edit'&&!keep)draft=y==='new'||!S.products.find(p=>p.id===y)?{id:'new',n:'',c:'',d:'',price:'',sh:0,av:'in_stock',f:0,nw:0,b:'',a:{},sp:[],im:[]}:JSON.parse(JSON.stringify(S.products.find(p=>p.id===y)));
 const v=ad?adm(x,y):k==='c'?list(x||'all'):k==='p'?prod(x):k==='s'?search():k==='about'?about():k==='contact'?contact():k===''?home():nf();
 const sy=scrollY;menu();$('#app').innerHTML=shell(v,ad);scrollTo(0,keep?sy:0)}
function build(){const f=document.querySelector('link[href*="fonts.googleapis"]').outerHTML;
 const st=Object.assign({},S,{categories:S.categories.map(c=>[c.id,c.p,c.n])});
 return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>'+esc(S.s.name)+'</title>'+f+'<style id="css">'+$('#css').textContent+'</style></head><body><div id="app"></div><div id="menu"></div><script id="state" type="application/json">'+JSON.stringify(st).replace(/</g,'\\u003c')+'<\/script><script id="code">'+$('#code').textContent+'<\/script></body></html>'}
async function publish(){if(!art)return alert('Publishing is only available to the owner.');try{await art.publish(build())}catch(e){if(e.code!=='conflict')alert('Could not publish: '+(e.code||e.message))}}
let cur=location.hash,st=[],bk=0;
function back(){if(st.length){bk=1;location.hash=st.pop()||'#/'}else location.hash='#/'}
addEventListener('hashchange',()=>{if(!bk)st.push(cur);bk=0;cur=location.hash;r()});r();
(async()=>{if(!window.claude)return;try{const u=await claude.use('user');canEdit=!!u&&u.canEdit();if(canEdit){art=await claude.use('artifact');menu();if(location.hash.startsWith('#/a/'))r()}}catch(e){}})();
</script></body></html>
